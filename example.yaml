# Xiaomi Whale Spout bidet seat (remote-controlled, non-Wi-Fi model) - ESP32 + CC1101 controller for ESPHome.
#
# Replaces the seat's 433 MHz RF remote: Home Assistant gets buttons and level sliders for every function, and
# the ESP32 listens to the real remote so Home Assistant always knows the settings. Protocol, hardware and
# design notes: docs/. Each command is sent twice (like the remote does).
#
# Wiring (CC1101 module pin -> ESP32 devkit GPIO), check the names on your module's silkscreen:
#   VCC       -> 3V3 (NOT 5 V - the CC1101 is a 3.3 V part)
#   GND       -> GND
#   SCK  (SCLK) -> GPIO18
#   MISO (SO)   -> GPIO19
#   MOSI (SI)   -> GPIO23
#   CSN  (CS)   -> GPIO5
#   GDO0      -> GPIO4   (transmit data)
#   GDO2      -> GPIO16  (receive data, labelled RX2 on many boards: lets the ESP hear the real remote)
#
# Access control: the controls are locked until a button is pressed on the real remote (so you have to be in
# the toilet holding it). They stay unlocked until 3 minutes after the most recent button press on the remote or
# accepted change from Home Assistant. Stop from Home Assistant is never blocked. See docs/access-control.md.
#
# Secrets (secrets.yaml): api_key (32-byte base64), wifi_ssid, wifi_password.

substitutions:
  name: whale-spout-bidet
  friendly_name: Whale Spout Bidet
  # CALIBRATE THIS. The radio's crystal is never exactly 26 MHz; the seat's receiver is narrow, so the transmitted
  # frequency must match the real remote to within a few kHz. 433.9077 MHz is the remote's centre frequency as
  # measured with an RTL-SDR; most CC1101 modules need an offset (see docs/hardware.md - the module this was
  # developed with was 35.5 kHz low and needed 433.9432 MHz).
  cc1101_frequency: 433.9077MHz


esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - includes/bidet_seat.h
  on_boot:
    priority: -100
    then:
      - cc1101.begin_rx
      - lambda: |-
          id(seat_rx)->register_dumper(&bidet_rx_dumper);
          id(unlocked_status).publish_state(false);  // always start locked
  devices:
    - id: bidet_seat
      name: Bidet Seat

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption: # reuses the API encryption key above

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  cs_pin: GPIO5
  frequency: ${cc1101_frequency}
  modulation_type: 2-FSK
  fsk_deviation: 34kHz
  symbol_rate: 1800
  output_power: 5 # dBm; the seat is close by. Raise if it does not respond (check your local 433 MHz power limit)

remote_transmitter:
  pin: GPIO4 # CC1101 GDO0: high = +deviation (mark), low = -deviation (space)
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - lambda: id(last_tx_ms) = millis();
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx
      - lambda: id(last_tx_ms) = millis();

# Hears the real remote on GDO2. The CC1101 has no squelch, so this also delivers noise and other 433 MHz
# devices; those fail the header/checksum test.
# BidetRxDumper in includes/bidet_seat.h picks out valid packets; the interval below acts on them.
remote_receiver:
  id: seat_rx
  pin: GPIO16 # CC1101 GDO2
  filter: 200us
  idle: 8ms
  tolerance: 40%

globals:
  - {id: controls_unlocked, type: bool, initial_value: 'false'}
  - {id: last_tx_ms, type: uint32_t, initial_value: '0'}
  - {id: last_cmd_ms, type: uint32_t, initial_value: '0'}
  - {id: unlock_end_ms, type: uint32_t, initial_value: '0'}
  - {id: rx_count, type: uint32_t, initial_value: '0'}
  - {id: seat_heat_before_away, type: int, restore_value: true, initial_value: '0'} # seat heat level to restore
  - {id: seat_function, type: int, initial_value: '0'} # last function used on the remote: 1 rear, 2 female, 3 dry

interval:
  # Act on packets heard from the real remote.
  - interval: 100ms
    then:
      - lambda: |-
          if (!bidet_rx.pending) return;
          bidet_rx.pending = false;
          if (millis() - id(last_tx_ms) < 500) return;  // our own transmission
          int key, n4, n5, n6;
          if (!bidet_decode(bidet_rx.packet, key, n4, n5, n6)) return;
          ESP_LOGI("bidet", "Remote: key 0x%02X n4=%d n5=%d n6=%d", key, n4, n5, n6);
          id(rx_count)++;
          id(remote_packets).publish_state(id(rx_count));
          const char *nm = key == 0x52 ? "Rear" : key == 0xD2 ? "Female" : key == 0x32 ? "Dry" : key == 0x92 ? "Stop"
                         : key == 0x56 ? "Self clean" : key == 0x72 ? "Swing" : key == 0xB2 ? "Massage"
                         : key == 0x84 ? "Seat temperature" : key == 0xD6 ? "Temperature" : key == 0x36 ? "Dry temperature"
                         : key == 0xD7 ? "Flow" : key == 0xD4 ? "Position" : "Unknown";
          id(last_remote_button).publish_state(nm);
          id(unlock_controls).execute();  // any button on the real remote unlocks, and extends, the controls
          // Learn the remote's settings. Rear / Female / Dry packets carry that function's own values and say
          // which function the temperature / flow / position buttons now adjust; the level buttons' own
          // packets (0xD6 water temp, 0xD7 flow, 0xD4 position, 0x36 dry temp) update the current function.
          auto set = [](esphome::number::Number *n, int v) {
            if (v && n->state != v) n->publish_state(v);
          };
          switch (key) {
            case 0x52:  // Rear
              id(seat_function) = 1;
              set(id(rear_temperature), bidet_level(n4));
              set(id(rear_flow), bidet_level(n5));
              set(id(rear_position), bidet_level(n6));
              break;
            case 0xD2:  // Female
              id(seat_function) = 2;
              set(id(female_temperature), bidet_level(n4));
              set(id(female_flow), bidet_level(n5));
              set(id(female_position), bidet_level(n6));
              break;
            case 0x32:  // Dry
              id(seat_function) = 3;
              set(id(dry_temperature), bidet_level(n4));
              break;
            case 0x36:  // dry temperature button (sent while Dry runs)
              id(seat_function) = 3;
              set(id(dry_temperature), bidet_level(n4));
              break;
            case 0xD6:  // temperature button: Rear or Female, whichever was used last
              if (id(seat_function) == 1) set(id(rear_temperature), bidet_level(n4));
              else if (id(seat_function) == 2) set(id(female_temperature), bidet_level(n4));
              break;
            case 0xD7:  // flow button
              if (id(seat_function) == 1) set(id(rear_flow), bidet_level(n5));
              else if (id(seat_function) == 2) set(id(female_flow), bidet_level(n5));
              break;
            case 0xD4:  // position button
              if (id(seat_function) == 1) set(id(rear_position), bidet_level(n6));
              else if (id(seat_function) == 2) set(id(female_position), bidet_level(n6));
              break;
            case 0x84:  // seat temperature: plain level 0..3
              if (n4 <= 3 && id(seat_temperature).state != n4) id(seat_temperature).publish_state(n4);
              break;
          }

  # Seconds left on the unlock, for the dashboard.
  - interval: 1s
    then:
      - lambda: |-
          int left = id(controls_unlocked) ? (int) ((int32_t) (id(unlock_end_ms) - millis()) / 1000) : 0;
          if (left < 0) left = 0;
          if (!id(unlock_time_remaining).has_state() || id(unlock_time_remaining).state != left)
            id(unlock_time_remaining).publish_state(left);

script:
  # Called when any button is heard from the real remote (see the interval above); restarts the 3-minute window.
  - id: unlock_controls
    mode: restart
    then:
      - lambda: |-
          id(controls_unlocked) = true;
          id(unlock_end_ms) = millis() + 180000;
          id(unlocked_status).publish_state(true);
      - delay: 180s
      - lambda: |-
          id(controls_unlocked) = false;
          id(unlocked_status).publish_state(false);

  # Called after every accepted HA command / change: pushes the lock back to 3 minutes from now, but only if the
  # controls are already unlocked (it can never unlock anything).
  - id: extend_unlock
    then:
      - if:
          condition:
            lambda: return id(controls_unlocked);
          then:
            - script.execute: unlock_controls

  - id: lock_controls
    then:
      - script.stop: unlock_controls
      - lambda: |-
          id(controls_unlocked) = false;
          id(unlocked_status).publish_state(false);

  - id: send_command
    mode: queued
    max_runs: 8
    parameters:
      key: int
      mode: int # 0: n4 = water temperature, 1: n4 = 0, 2: n4 = seat level, 3: n4 = dry temperature
      force: int # 1 = skip the lock (only the away-mode switch uses this, to turn seat heat off / restore it)
      fn: int # whose temperature / flow / position go in the packet: 1 rear, 2 female (3 dry uses rear's)
    then:
      - if:
          condition:
            lambda: |-
              if (key == 0x92 || force) return true;  // Stop is never blocked; force = away mode
              if (!id(controls_unlocked)) {
                ESP_LOGW("bidet", "Locked: ignoring key 0x%02X (press a button on the remote to unlock)", key);
                return false;
              }
              bool level = key == 0x84 || key == 0xD6 || key == 0x36 || key == 0xD7 || key == 0xD4;
              if (!level && millis() - id(last_cmd_ms) < 1000) {  // one action button per second
                ESP_LOGW("bidet", "Rate limited: ignoring key 0x%02X", key);
                return false;
              }
              id(last_cmd_ms) = millis();
              if (key == 0x52) id(seat_function) = 1;  // the function the seat is now running / adjusting
              else if (key == 0xD2) id(seat_function) = 2;
              else if (key == 0x32) id(seat_function) = 3;
              return true;
          then:
            - script.execute: extend_unlock
            - remote_transmitter.transmit_raw:
                code: !lambda |-
                  // Rear / Female (and Stop, the toggles...) carry that function's temperature, flow and position;
                  // Dry carries the dry temperature in n4.
                  bool fem = fn == 2;
                  int t = (int) (fem ? id(female_temperature).state : id(rear_temperature).state);
                  int f = (int) (fem ? id(female_flow).state : id(rear_flow).state);
                  int p = (int) (fem ? id(female_position).state : id(rear_position).state);
                  return bidet_packet(key, mode, t, (int) id(dry_temperature).state, f, p, (int) id(seat_temperature).state);

switch:
  # Away mode: HA turns this on when nobody is home and off when somebody returns. It turns seat heat off (and
  # remembers the level) and puts it back afterwards, even while the controls are locked - it can only ever turn
  # the heat off or restore what it was, so it cannot be used to run the seat. Heat commands are sent twice, 5 s
  # apart, in case the seat misses one.
  - platform: template
    device_id: bidet_seat
    id: seat_heat_away
    name: Seat Heat Away Mode
    icon: mdi:home-export-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - if:
          condition:
            lambda: return id(seat_temperature).state > 0;
          then:
            - lambda: |-
                id(seat_heat_before_away) = (int) id(seat_temperature).state;
                id(seat_temperature).publish_state(0);
            - script.execute: {id: send_command, key: 0x84, mode: 2, fn: 1, force: 1}
            - delay: 5s
            - script.execute: {id: send_command, key: 0x84, mode: 2, fn: 1, force: 1}
    turn_off_action:
      - if:
          condition:
            lambda: return id(seat_heat_before_away) > 0 && id(seat_temperature).state == 0;
          then:
            - lambda: id(seat_temperature).publish_state(id(seat_heat_before_away));
            - script.execute: {id: send_command, key: 0x84, mode: 2, fn: 1, force: 1}
            - delay: 5s
            - script.execute: {id: send_command, key: 0x84, mode: 2, fn: 1, force: 1}
      - lambda: id(seat_heat_before_away) = 0;

binary_sensor:
  - platform: template
    device_id: bidet_seat
    id: unlocked_status
    name: Controls Unlocked
    icon: mdi:lock-open-variant

text_sensor:
  - platform: template
    device_id: bidet_seat
    id: last_remote_button
    name: Last Remote Button
    icon: mdi:remote

sensor:
  - platform: template
    device_id: bidet_seat
    id: remote_packets
    name: Remote Packets Heard # counts valid packets decoded from the real remote (each press is sent twice)
    icon: mdi:counter
    state_class: total_increasing
    accuracy_decimals: 0
  - platform: template
    device_id: bidet_seat
    id: unlock_time_remaining
    name: Unlock Time Remaining
    icon: mdi:timer-sand
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0

# The seat reports nothing back. The remote keeps separate temperature / flow / position settings for Rear and
# Female and a temperature for Dry, and sends the function's own values with every Rear / Female / Dry command
# (n4 / n5 / n6). So these numbers are the settings used when HA starts a function; they are updated from the
# remote whenever one of those functions (or a level button, after it) is pressed on the remote. Changing one
# here needs the controls unlocked. It is sent straight away (as the remote's level button would, so it takes
# effect while the function is running) when that function is the one last used; otherwise it is stored and sent
# with the next command for that function.
number:
  - platform: template
    device_id: bidet_seat
    id: rear_temperature
    name: Rear Temperature
    icon: mdi:thermometer-water
    min_value: 1
    max_value: 3
    step: 1
    mode: slider
    optimistic: false # state follows publish_state: set only when unlocked, or from the remote
    restore_value: true
    initial_value: 2 # 1 = lowest
    set_action:
      - if:
          condition:
            lambda: return id(controls_unlocked);
          then:
            - script.execute: extend_unlock
            - lambda: id(rear_temperature).publish_state(x);
            - if:
                condition:
                  lambda: return id(seat_function) == 1;  # only the function in use; otherwise just stored
                then:
                  - script.execute: {id: send_command, key: 0xD6, mode: 0, fn: 1, force: 0}
  - platform: template
    device_id: bidet_seat
    id: rear_flow
    name: Rear Flow
    icon: mdi:water-percent
    min_value: 1
    max_value: 3
    step: 1
    mode: slider
    optimistic: false # state follows publish_state: set only when unlocked, or from the remote
    restore_value: true
    initial_value: 2
    set_action:
      - if:
          condition:
            lambda: return id(controls_unlocked);
          then:
            - script.execute: extend_unlock
            - lambda: id(rear_flow).publish_state(x);
            - if:
                condition:
                  lambda: return id(seat_function) == 1;  # only the function in use; otherwise just stored
                then:
                  - script.execute: {id: send_command, key: 0xD7, mode: 0, fn: 1, force: 0}
  - platform: template
    device_id: bidet_seat
    id: rear_position
    name: Rear Position
    icon: mdi:arrow-expand-vertical
    min_value: 1
    max_value: 3
    step: 1
    mode: slider
    optimistic: false # state follows publish_state: set only when unlocked, or from the remote
    restore_value: true
    initial_value: 2 # 1 = back, 2 = middle, 3 = forward
    set_action:
      - if:
          condition:
            lambda: return id(controls_unlocked);
          then:
            - script.execute: extend_unlock
            - lambda: id(rear_position).publish_state(x);
            - if:
                condition:
                  lambda: return id(seat_function) == 1;  # only the function in use; otherwise just stored
                then:
                  - script.execute: {id: send_command, key: 0xD4, mode: 0, fn: 1, force: 0}
  - platform: template
    device_id: bidet_seat
    id: female_temperature
    name: Female Temperature
    icon: mdi:thermometer-water
    min_value: 1
    max_value: 3
    step: 1
    mode: slider
    optimistic: false # state follows publish_state: set only when unlocked, or from the remote
    restore_value: true
    initial_value: 2 # 1 = lowest
    set_action:
      - if:
          condition:
            lambda: return id(controls_unlocked);
          then:
            - script.execute: extend_unlock
            - lambda: id(female_temperature).publish_state(x);
            - if:
                condition:
                  lambda: return id(seat_function) == 2;  # only the function in use; otherwise just stored
                then:
                  - script.execute: {id: send_command, key: 0xD6, mode: 0, fn: 2, force: 0}
  - platform: template
    device_id: bidet_seat
    id: female_flow
    name: Female Flow
    icon: mdi:water-percent
    min_value: 1
    max_value: 3
    step: 1
    mode: slider
    optimistic: false # state follows publish_state: set only when unlocked, or from the remote
    restore_value: true
    initial_value: 2
    set_action:
      - if:
          condition:
            lambda: return id(controls_unlocked);
          then:
            - script.execute: extend_unlock
            - lambda: id(female_flow).publish_state(x);
            - if:
                condition:
                  lambda: return id(seat_function) == 2;  # only the function in use; otherwise just stored
                then:
                  - script.execute: {id: send_command, key: 0xD7, mode: 0, fn: 2, force: 0}
  - platform: template
    device_id: bidet_seat
    id: female_position
    name: Female Position
    icon: mdi:arrow-expand-vertical
    min_value: 1
    max_value: 3
    step: 1
    mode: slider
    optimistic: false # state follows publish_state: set only when unlocked, or from the remote
    restore_value: true
    initial_value: 2 # 1 = back, 2 = middle, 3 = forward
    set_action:
      - if:
          condition:
            lambda: return id(controls_unlocked);
          then:
            - script.execute: extend_unlock
            - lambda: id(female_position).publish_state(x);
            - if:
                condition:
                  lambda: return id(seat_function) == 2;  # only the function in use; otherwise just stored
                then:
                  - script.execute: {id: send_command, key: 0xD4, mode: 0, fn: 2, force: 0}
  - platform: template
    device_id: bidet_seat
    id: dry_temperature
    name: Dry Temperature
    icon: mdi:thermometer-lines
    min_value: 1
    max_value: 3
    step: 1
    mode: slider
    optimistic: false # state follows publish_state: set only when unlocked, or from the remote
    restore_value: true
    initial_value: 2
    set_action:
      - if:
          condition:
            lambda: return id(controls_unlocked);
          then:
            - script.execute: extend_unlock
            - lambda: id(dry_temperature).publish_state(x);
            - if:
                condition:
                  lambda: return id(seat_function) == 3;  # only the function in use; otherwise just stored
                then:
                  - script.execute: {id: send_command, key: 0x36, mode: 3, fn: 3, force: 0}
  - platform: template
    device_id: bidet_seat
    id: seat_temperature
    name: Seat Temperature
    icon: mdi:seat-passenger
    min_value: 0
    max_value: 3
    step: 1
    mode: slider
    optimistic: false
    restore_value: true
    initial_value: 0 # 0 = off (the remote's Eco button)
    set_action:
      - if:
          condition:
            lambda: return id(controls_unlocked);
          then:
            - script.execute: extend_unlock
            - lambda: id(seat_temperature).publish_state(x);
            - script.execute:
                id: send_command
                key: 0x84
                mode: 2
                fn: 1
                force: 0

button:
  - platform: template
    device_id: bidet_seat
    name: Lock Controls # re-lock early; only a button on the real remote can unlock
    icon: mdi:lock
    on_press:
      - script.execute: lock_controls
  - platform: template
    device_id: bidet_seat
    name: Rear
    icon: mdi:shower
    on_press:
      - script.execute: {id: send_command, key: 0x52, mode: 0, fn: 1, force: 0}
  - platform: template
    device_id: bidet_seat
    name: Female
    icon: mdi:shower
    on_press:
      - script.execute: {id: send_command, key: 0xD2, mode: 0, fn: 2, force: 0}
  - platform: template
    device_id: bidet_seat
    name: Dry
    icon: mdi:air-filter
    on_press:
      - script.execute: {id: send_command, key: 0x32, mode: 3, fn: 3, force: 0}
  - platform: template
    device_id: bidet_seat
    name: Stop
    icon: mdi:stop
    on_press:
      - script.execute: {id: send_command, key: 0x92, mode: 0, fn: 1, force: 0}
  - platform: template
    device_id: bidet_seat
    name: Self Clean
    icon: mdi:broom
    on_press:
      - script.execute: {id: send_command, key: 0x56, mode: 1, fn: 1, force: 0}
  - platform: template
    device_id: bidet_seat
    name: Swing Toggle # same code turns it on and off; the seat decides
    icon: mdi:swap-horizontal
    on_press:
      - script.execute: {id: send_command, key: 0x72, mode: 0, fn: 1, force: 0}
  - platform: template
    device_id: bidet_seat
    name: Massage Toggle # same code turns it on and off; the seat decides
    icon: mdi:vibrate
    on_press:
      - script.execute: {id: send_command, key: 0xB2, mode: 1, fn: 1, force: 0}
