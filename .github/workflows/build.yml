name: Build

# Runs the protocol tests, then compiles example.yaml against this commit.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Protocol tests
        run: python3 -m unittest discover -s tests -v

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install "esphome==2026.10.1"
      - name: Add dummy secrets
        run: |
          printf 'api_key: "%s"\nwifi_ssid: "ci"\nwifi_password: "ci-password"\n' \
            "$(openssl rand -base64 32)" > secrets.yaml
      - name: Validate
        run: esphome config example.yaml > validated.txt || { cat validated.txt; exit 1; }
      - name: Compile
        run: esphome compile example.yaml
