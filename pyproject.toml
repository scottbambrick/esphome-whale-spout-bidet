# Lint and format settings for the Python in this repo: ESPHome's ruff rules
# (esphome/esphome pyproject.toml), so the code reads like ESPHome's own.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "PERF", # performance
  "PIE",  # flake8-pie
  "PL",   # pylint
  "RET",  # flake8-return
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "E501",    # line too long (the formatter handles it)
  "PLC0415", # import inside a function
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR2004", # magic value used in comparison
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["esphome"]
combine-as-imports = true
split-on-trailing-comma = false
